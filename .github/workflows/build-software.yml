name: Build Ikemen GO (SDL2 Software Renderer) for R36S

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container:
      image: ubuntu:20.04
      options: --privileged
    defaults:
      run:
        shell: bash

    steps:
      - name: 安装编译依赖
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y \
            ca-certificates curl wget git pkg-config make ninja-build \
            nasm yasm build-essential zip unzip xz-utils file python3 \
            cmake libxmp-dev \
            libdrm-dev libgbm-dev libegl1-mesa-dev libgles2-mesa-dev \
            libasound2-dev \
            libgtk-3-dev \
            libx11-dev libxext-dev libxi-dev libxrandr-dev libxcursor-dev \
            libwayland-dev libxkbcommon-dev
          echo "glibc: $(ldd --version | head -1)"
          echo "gcc:   $(gcc --version | head -1)"
          echo "nasm:  $(nasm -v)"

      - name: 安装 Go
        run: |
          wget -q https://go.dev/dl/go1.24.5.linux-arm64.tar.gz -O /tmp/go.tgz
          rm -rf /usr/local/go
          tar -C /usr/local -xzf /tmp/go.tgz
          /usr/local/go/bin/go version

      - name: 获取 Ikemen GO 源码 (sdl2_renderer 分支)
        run: |
          git clone --depth 1 --branch sdl2_renderer https://github.com/leonkasovan/Ikemen-GO.git /tmp/ikemen
          cd /tmp/ikemen
          git log -1 --oneline
          echo "=== 软件渲染文件确认 ==="
          ls -l src/render_sw*.go

      - name: 打补丁 (启用纯 CPU 软件渲染 + KMSDRM)
        run: |
          cd /tmp/ikemen
          export PATH=/usr/local/go/bin:$PATH

          python3 - <<'PY'
          import sys, os

          def need(cond, msg):
              if not cond:
                  sys.exit('PATCH_FAILED: ' + msg)

          # ===== 补丁 1：Makefile 删除 armdevice 标签 =====
          # sdl2_renderer 的软件渲染器 tag 是 !android && !armdevice。
          # Makefile 在 arm64+linux 时自动加 armdevice，会排除软件渲染器。
          # 必须去掉，否则 Renderer_SW 不会被编译进去。
          mp = 'Makefile'
          s = open(mp, encoding='utf-8', newline='').read()
          old = ('  ifeq ($(HOST_ARCH),arm64)\n'
                 '    ifeq ($(HOST_OS),linux)\n'
                 '      GO_TAGS += armdevice\n'
                 '    endif\n'
                 '  endif\n')
          need(s.count(old) == 1, 'armdevice block anchor count=%d' % s.count(old))
          s = s.replace(old, '', 1)
          open(mp, 'w', encoding='utf-8', newline='\n').write(s)
          print('PATCH_OK: removed armdevice tag')

          # ===== 补丁 2：Makefile SDL2 linux flags 启用 KMSDRM =====
          # R36S 无 X server / Wayland，需 KMSDRM 直连 framebuffer 建窗口。
          # 软件渲染器仍需要 SDL_Window 来 present（不走 GL）。
          s = open(mp, encoding='utf-8', newline='').read()
          old_sdl = ('else ifeq ($(HOST_OS),linux)\n'
                     '  SDL2_CMAKE_FLAGS += \\\n'
                     '\t-DSDL_OPENGL=ON \\\n'
                     '\t-DSDL_OPENGLES=OFF \\\n'
                     '\t-DSDL_X11=ON \\\n'
                     '\t-DSDL_WAYLAND=OFF \\\n'
                     '\t-DSDL_COCOA=OFF \\\n'
                     '\t-DSDL_VULKAN=OFF\n')
          new_sdl = ('else ifeq ($(HOST_OS),linux)\n'
                     '  SDL2_CMAKE_FLAGS += \\\n'
                     '\t-DSDL_OPENGL=OFF \\\n'
                     '\t-DSDL_OPENGLES=OFF \\\n'
                     '\t-DSDL_X11=OFF \\\n'
                     '\t-DSDL_WAYLAND=OFF \\\n'
                     '\t-DSDL_KMSDRM=ON \\\n'
                     '\t-DSDL_GBM=ON \\\n'
                     '\t-DSDL_COCOA=OFF \\\n'
                     '\t-DSDL_VULKAN=OFF\n')
          need(s.count(old_sdl) == 1, 'sdl2 linux flags anchor count=%d' % s.count(old_sdl))
          s = s.replace(old_sdl, new_sdl, 1)
          open(mp, 'w', encoding='utf-8', newline='\n').write(s)
          print('PATCH_OK: SDL2 KMSDRM enabled, X11/OpenGL disabled')

          # ===== 补丁 2b：重写 util_desktop.go 的 selectRenderer =====
          import glob as _glob
          up = 'src/util_desktop.go'
          need(os.path.exists(up), 'util_desktop.go not found')
          u = open(up, encoding='utf-8', newline='').read()
          import re as _re
          m = _re.search(r'func selectRenderer\(cfgVal string\) \(Renderer, FontRenderer\) \{.*?\n\}', u, _re.S)
          need(m is not None, 'selectRenderer body not found in util_desktop.go')
          new_fn = ('func selectRenderer(cfgVal string) (Renderer, FontRenderer) {\n'
                    '\tvar gfx Renderer\n'
                    '\tvar gfxFont FontRenderer\n'
                    '\t_ = cfgVal\n'
                    '\tgfx = &Renderer_SW{}\n'
                    '\tgfxFont = &FontRenderer_SW{}\n'
                    '\treturn gfx, gfxFont\n'
                    '}')
          u = u[:m.start()] + new_fn + u[m.end():]

          # 补 2b-2：gl33/gles32 被排除后，render.go:427 引用的
          # flushSpriteQueueBatched 没了定义。补一个分发到软件光栅器的版本
          #（与 render_gl33.go 原实现一致，只是删掉了对已排除类型的分支）。
          stub = ('\n'
                  '// flushSpriteQueueBatched routes the deferred sprite queue to the\n'
                  '// software rasterizer (GL33/GLES32 backends are excluded from this build).\n'
                  'func flushSpriteQueueBatched(queue []SpriteDrawCall) {\n'
                  '\tif r, ok := gfx.(*Renderer_SW); ok {\n'
                  '\t\tr.flushSWQueue(queue)\n'
                  '\t\treturn\n'
                  '\t}\n'
                  '\tfor i := range queue {\n'
                  '\t\tif queue[i].isFlat {\n'
                  '\t\t\trenderFlatCallImmediate(&queue[i])\n'
                  '\t\t} else {\n'
                  '\t\t\trenderSpriteImmediate(queue[i].rp)\n'
                  '\t\t}\n'
                  '\t}\n'
                  '\tdrawCallStats.TotalBatches += len(queue)\n'
                  '}\n')
          u = u + stub
          open(up, 'w', encoding='utf-8', newline='\n').write(u)
          print('PATCH_OK: selectRenderer rewritten + flushSpriteQueueBatched added')

          # ===== 补丁 2e：错误弹窗改为 stderr 输出 =====
          # sqweek/dialog 依赖 GTK/X server。R36S(ArkOS) 无 X server，
          # ShowErrorDialog 会因 GTK 初始化失败而二次 panic，
          # 掩盖真实错误并阻止启动。改为打印到 stderr（启动脚本已重定向进日志）。
          up2 = 'src/util_desktop.go'
          u = open(up2, encoding='utf-8', newline='').read()
          need('\t"github.com/sqweek/dialog"\n' in u, 'sqweek import anchor')
          u = u.replace('\t"github.com/sqweek/dialog"\n', '')
          u = u.replace('\t"fmt"\n', '\t"fmt"\n\t"os"\n', 1)
          old_dlg = ('// Message box implementation\n'
                     'func ShowInfoDialog(message, title string) {\n'
                     '\tdialog.Message(message).Title(title).Info()\n'
                     '}\n'
                     '\n'
                     'func ShowErrorDialog(message string) {\n'
                     '\tdialog.Message(message).Title("I.K.E.M.E.N Error").Error()\n'
                     '}')
          need(u.count(old_dlg) == 1, 'dialog funcs anchor count=%d' % u.count(old_dlg))
          new_dlg = ('// Message box implementation\n'
                     '// Headless/embedded systems have no X server; sqweek/dialog (GTK) would\n'
                     '// panic there and swallow the real error. Print to stderr instead —\n'
                     '// the launch script captures stderr into the port log.\n'
                     'func ShowInfoDialog(message, title string) {\n'
                     '\tfmt.Fprintf(os.Stderr, "[Ikemen Info] %s: %s\\n", title, message)\n'
                     '}\n'
                     '\n'
                     'func ShowErrorDialog(message string) {\n'
                     '\tfmt.Fprintf(os.Stderr, "[Ikemen Error] %s\\n", message)\n'
                     '}')
          u = u.replace(old_dlg, new_dlg, 1)
          open(up2, 'w', encoding='utf-8', newline='\n').write(u)
          print('PATCH_OK: error dialogs print to stderr (no GTK)')

          # ===== 补丁 2f：newWindow 在 KMSDRM 下的容错 =====
          # 1) GetDesktopDisplayMode 在 KMSDRM 上可能失败，原代码直接 return error
          #    —— 这是真机日志中 system.go:396 chk 失败的最可能来源。降级为用配置尺寸。
          # 2) 窗口化 CreateWindow 在 KMSDRM 上可能被拒绝，失败时改用全屏桌面重试。
          sp = 'src/system_sdl.go'
          s = open(sp, encoding='utf-8', newline='').read()
          old_mode = ('			mode, err := sdl.GetDesktopDisplayMode(0)\n'
                      '			if err != nil {\n'
                      '				return nil, fmt.Errorf("failed to obtain primary monitor")\n'
                      '			}\n'
                      '			desktopW, desktopH = mode.W, mode.H')
          need(s.count(old_mode) == 1, 'desktop mode anchor count=%d' % s.count(old_mode))
          new_mode = ('			mode, merr := sdl.GetDesktopDisplayMode(0)\n'
                      '			if merr != nil || mode.W <= 0 {\n'
                      '				fmt.Printf("WARN: GetDesktopDisplayMode failed (%v), falling back to config size\\n", merr)\n'
                      '				desktopW, desktopH = w2, h2\n'
                      '			} else {\n'
                      '				desktopW, desktopH = mode.W, mode.H\n'
                      '			}')
          s = s.replace(old_mode, new_mode, 1)
          old_cw = ('		window, err = sdl.CreateWindow(s.cfg.Config.WindowTitle, posX, posY, w2, h2, windowFlags)\n'
                    '		if err != nil {\n'
                    '			return nil, fmt.Errorf("failed to create window: %w", err)\n'
                    '		}')
          need(s.count(old_cw) == 1, 'createwindow anchor count=%d' % s.count(old_cw))
          new_cw = ('		window, err = sdl.CreateWindow(s.cfg.Config.WindowTitle, posX, posY, w2, h2, windowFlags)\n'
                    '		if err != nil {\n'
                    '			// KMSDRM and other headless backends often reject windowed windows;\n'
                    '			// retry as fullscreen desktop, the most permissive mode.\n'
                    '			fmt.Printf("WARN: windowed CreateWindow failed (%v), retrying fullscreen-desktop\\n", err)\n'
                    '			window, err = sdl.CreateWindow(s.cfg.Config.WindowTitle, 0, 0, desktopW, desktopH,\n'
                    '				sdl.WINDOW_FULLSCREEN_DESKTOP|sdl.WINDOW_SHOWN|sdl.WINDOW_INPUT_FOCUS)\n'
                    '			if err != nil {\n'
                    '				return nil, fmt.Errorf("failed to create window: %w", err)\n'
                    '			}\n'
                    '		}')
          s = s.replace(old_cw, new_cw, 1)
          open(sp, 'w', encoding='utf-8', newline='\n').write(s)
          print('PATCH_OK: newWindow KMSDRM fallbacks added')

          # ===== 补丁 2c：排除其他所有渲染器文件 =====
          # gl33/gles32/vk/dx 与 sw 可能含同名包级符号（helper/变量），同时编译会
          # redeclare。2b 已消除外部引用，现在可以安全排除。
          excluded = ['render_gles32.go','font_gles32.go','render_gl33.go','font_gl33.go',
                      'render_vk.go','font_vk.go','render_dx.go','render_dx_font.go',
                      'util_armdevice.go','util_android.go','util_darwin.go','util_windows.go']
          for fn in excluded:
              fp = 'src/' + fn
              if not os.path.exists(fp):
                  continue
              body = open(fp, encoding='utf-8', newline='').read()
              # 剔除所有旧 build 标记（有些文件带版权头，标记不在首行；
              # 盲注入会造成 multiple //go:build comments 编译错误）
              lines = [ln for ln in body.split('\n')
                       if not ln.startswith('//go:build') and not ln.startswith('// +build')]
              body = '//go:build ignore\n\n' + '\n'.join(lines)
              open(fp, 'w', encoding='utf-8', newline='\n').write(body)
              print('EXCLUDED:', fn)
          print('PATCH_OK: non-SW renderers excluded')

          # ===== 补丁 2d：确认没有残留对被排除类型的引用 =====
          bad = []
          for g in _glob.glob('src/*.go'):
              if _glob.fnmatch.fnmatch(g, 'src/render_sw*.go') or g.endswith(('util_desktop.go','main.go')):
                  pass
              b = open(g, encoding='utf-8', errors='replace').read()
              if b.startswith('//go:build ignore'):
                  continue
              for sym in ('Renderer_GL33','Renderer_GLES32','Renderer_VK','Renderer_DX',
                          'FontRenderer_GL33','FontRenderer_GLES32','FontRenderer_VK','FontRenderer_DX'):
                  if sym in b:
                      bad.append((g, sym))
          if bad:
              for g, sym in bad:
                  print('STILL_REFERENCED:', g, sym)
              sys.exit('PATCH_FAILED: dangling renderer references')
          print('PATCH_OK: no dangling references')

          # ===== 补丁 3：render_sw.go 强制软件渲染，不尝试加速 =====
          # 原代码先试 SDL_RENDERER_ACCELERATED，在 Mali 上可能"创建成功但黑屏"，
          # 那样就不会回退软件。强制 flags=0 (SDL_RENDERER_SOFTWARE) 保证纯 CPU。
          rp = 'src/render_sw.go'
          t = open(rp, encoding='utf-8', newline='').read()
          old_acc = 'r.renderer, err = sdl.CreateRenderer(sys.window.Window, -1, sdl.RENDERER_ACCELERATED)'
          need(t.count(old_acc) == 1, 'renderer accelerated anchor count=%d' % t.count(old_acc))
          # SDL_RENDERER_SOFTWARE = 0x00000001. Use explicit numeric value so we
          # don't depend on the Go binding constant name; forces pure CPU path.
          t = t.replace(old_acc, 'r.renderer, err = sdl.CreateRenderer(sys.window.Window, -1, sdl.RendererFlags(1)) // FORCE SOFTWARE', 1)
          open(rp, 'w', encoding='utf-8', newline='\n').write(t)
          print('PATCH_OK: forced SDL_RENDERER_SOFTWARE')

          # ===== 补丁 4：config.ini RenderMode = SDL2 Software =====
          cp = 'save/config.ini'
          if os.path.exists(cp):
              import re
              c = open(cp, encoding='utf-8', errors='replace').read()
              c = re.sub(r'^(RenderMode\s*=\s*).*$', r'\1Linux FB', c, flags=re.M)
              open(cp, 'w', encoding='utf-8', newline='\n').write(c)
              print('PATCH_OK: config RenderMode=SDL2 Software')
          else:
              print('WARN: save/config.ini not found (engine will generate defaults)')
          PY

          echo "=== 补丁确认 ==="
          grep -n "armdevice" Makefile || echo "armdevice removed OK"
          grep -n "SDL_KMSDRM" Makefile || echo "KMSDRM MISSING!"
          grep -n "FORCE SOFTWARE" src/render_sw.go || echo "FORCE SOFTWARE MISSING!"
          grep -n "SDL2 Software" save/config.ini 2>/dev/null || echo "(config will be generated)"

      - name: 打补丁 5 (Linux FB 直写渲染器)
        run: |
          cd /tmp/ikemen
          python3 - <<'PY'
          import sys, os

          def need(cond, msg):
              if not cond:
                  sys.exit('PATCH_FAILED(5): ' + msg)

          # ===== 5.1 新文件 render_fb_linux.go：fb0 直写驱动 =====
          # 设备 GPU 路线已死（libmali 10.6 vs 内核 11.7 版本不匹配，GBM/EGL 全灭）。
          # 纯 CPU 渲染 + mmap 写 /dev/fb0（640x480 BGRA），绕开整个 GBM/EGL 栈。
          fb_src = (
              '//go:build linux && !android\n\n'
              'package main\n\n'
              'import (\n'
              '\t"fmt"\n'
              '\t"syscall"\n'
              '\t"unsafe"\n'
              ')\n\n'
              'const (\n'
              '\tfbIOGetVScreenInfo = 0x4600\n'
              '\tfbIOGetFScreenInfo = 0x4602\n'
              ')\n\n'
              'type fbDev struct {\n'
              '\tfd     int\n'
              '\tmm     []byte\n'
              '\tw, h   int\n'
              '\tstride int\n'
              '\txmap   []int32\n'
              '\tymap   []int32\n'
              '\tsw, sh int\n'
              '}\n\n'
              'func le32(b []byte) uint32 {\n'
              '\treturn uint32(b[0]) | uint32(b[1])<<8 | uint32(b[2])<<16 | uint32(b[3])<<24\n'
              '}\n\n'
              'func fbdevOpen() (*fbDev, error) {\n'
              '\tfd, err := syscall.Open("/dev/fb0", syscall.O_RDWR, 0)\n'
              '\tif err != nil {\n'
              '\t\treturn nil, fmt.Errorf("open /dev/fb0: %w", err)\n'
              '\t}\n'
              '\tvar vbuf [256]byte\n'
              '\tif _, _, errno := syscall.Syscall(syscall.SYS_IOCTL, uintptr(fd), fbIOGetVScreenInfo, uintptr(unsafe.Pointer(&vbuf[0]))); errno != 0 {\n'
              '\t\tsyscall.Close(fd)\n'
              '\t\treturn nil, fmt.Errorf("FBIOGET_VSCREENINFO: %v", errno)\n'
              '\t}\n'
              '\txres := int(le32(vbuf[0:]))\n'
              '\tyres := int(le32(vbuf[4:]))\n'
              '\tvar fbuf [256]byte\n'
              '\tif _, _, errno := syscall.Syscall(syscall.SYS_IOCTL, uintptr(fd), fbIOGetFScreenInfo, uintptr(unsafe.Pointer(&fbuf[0]))); errno != 0 {\n'
              '\t\tsyscall.Close(fd)\n'
              '\t\treturn nil, fmt.Errorf("FBIOGET_FSCREENINFO: %v", errno)\n'
              '\t}\n'
              '\tsmemLen := int(le32(fbuf[24:]))\n'
              '\tlineLen := int(le32(fbuf[44:]))\n'
              '\tif xres <= 0 || yres <= 0 {\n'
              '\t\tsyscall.Close(fd)\n'
              '\t\treturn nil, fmt.Errorf("fb0 reports invalid mode %dx%d", xres, yres)\n'
              '\t}\n'
              '\tif lineLen <= 0 {\n'
              '\t\tlineLen = xres * 4\n'
              '\t}\n'
              '\tsize := smemLen\n'
              '\tif size < lineLen*yres {\n'
              '\t\tsize = lineLen * yres\n'
              '\t}\n'
              '\tmm, err := syscall.Mmap(fd, 0, size, syscall.PROT_READ|syscall.PROT_WRITE, syscall.MAP_SHARED)\n'
              '\tif err != nil {\n'
              '\t\tsyscall.Close(fd)\n'
              '\t\treturn nil, fmt.Errorf("mmap fb0: %w", err)\n'
              '\t}\n'
              '\treturn &fbDev{fd: fd, mm: mm, w: xres, h: yres, stride: lineLen}, nil\n'
              '}\n\n'
              '// blit copies the engine RGBA framebuffer (row stride pitch) into the\n'
              '// fb0 mmap with BGRA byte order, nearest-neighbour scaled when the\n'
              '// engine resolution differs from the display mode.\n'
              'func (f *fbDev) blit(pix []byte, w, h, pitch int32) {\n'
              '\tif w <= 0 || h <= 0 || len(pix) < int(w)*int(h)*4 {\n'
              '\t\treturn\n'
              '\t}\n'
              '\tif f.sw != int(w) || f.sh != int(h) {\n'
              '\t\tf.sw, f.sh = int(w), int(h)\n'
              '\t\tf.xmap = make([]int32, f.w)\n'
              '\t\tf.ymap = make([]int32, f.h)\n'
              '\t\tfor dx := 0; dx < f.w; dx++ {\n'
              '\t\t\tf.xmap[dx] = int32(int64(dx) * int64(w) / int64(f.w))\n'
              '\t\t}\n'
              '\t\tfor dy := 0; dy < f.h; dy++ {\n'
              '\t\t\tf.ymap[dy] = int32(int64(dy) * int64(h) / int64(f.h))\n'
              '\t\t}\n'
              '\t}\n'
              '\tfor dy := 0; dy < f.h; dy++ {\n'
              '\t\tsrc := pix[int(f.ymap[dy])*int(pitch):]\n'
              '\t\trow := f.mm[dy*f.stride : dy*f.stride+f.w*4]\n'
              '\t\tfor dx := 0; dx < f.w; dx++ {\n'
              '\t\t\to := int(f.xmap[dx]) * 4\n'
              '\t\t\t// engine pix is [R,G,B,A]; fb0 wants [B,G,R,X]\n'
              '\t\t\trow[dx*4+0] = src[o+2]\n'
              '\t\t\trow[dx*4+1] = src[o+1]\n'
              '\t\t\trow[dx*4+2] = src[o+0]\n'
              '\t\t\trow[dx*4+3] = 255\n'
              '\t\t}\n'
              '\t}\n'
              '}\n\n'
              'func (f *fbDev) close() {\n'
              '\tif f.mm != nil {\n'
              '\t\t_ = syscall.Munmap(f.mm)\n'
              '\t\tf.mm = nil\n'
              '\t}\n'
              '\tif f.fd >= 0 {\n'
              '\t\t_ = syscall.Close(f.fd)\n'
              '\t\tf.fd = -1\n'
              '\t}\n'
              '}\n'
          )
          open('src/render_fb_linux.go', 'w', encoding='utf-8', newline='\n').write(fb_src)
          print('PATCH5_OK: render_fb_linux.go written')

          # ===== 5.2 render_sw.go：fb 字段 + FB 初始化 + FB 呈现 =====
          rp = 'src/render_sw.go'
          t = open(rp, encoding='utf-8', newline='').read()
          old_field = '\tdirtyX0, dirtyY0, dirtyX1, dirtyY1 int32\n}'
          need(t.count(old_field) == 1, 'sw struct field anchor count=%d' % t.count(old_field))
          t = t.replace(old_field,
              '\tdirtyX0, dirtyY0, dirtyX1, dirtyY1 int32\n'
              '\n'
              '\t// Linux FB0 direct-render device; non-nil only when RenderMode == "Linux FB".\n'
              '\tfb *fbDev\n'
              '}', 1)
          old_init = ('\tfunc_placeholder_never_matches')
          init_anchor = ('\tr.w, r.h = sys.scrrect[2], sys.scrrect[3]\n'
                          '\tr.pitch = int(r.w) * 4\n'
                          '\tr.pix = make([]byte, int(r.w)*int(r.h)*4)\n')
          need(t.count(init_anchor) == 1, 'sw init anchor count=%d' % t.count(init_anchor))
          t = t.replace(init_anchor,
              init_anchor +
              '\n'
              '\t// Linux FB mode: no SDL window/renderer - present straight to /dev/fb0.\n'
              '\tif sys.cfg.Video.RenderMode == "Linux FB" {\n'
              '\t\tfb, ferr := fbdevOpen()\n'
              '\t\tif ferr != nil {\n'
              '\t\t\tpanic(fmt.Sprintf("[Linux FB] %v", ferr))\n'
              '\t\t}\n'
              '\t\tr.fb = fb\n'
              '\t\tr.dirty = true\n'
              '\t\tr.dirtyX0, r.dirtyY0, r.dirtyX1, r.dirtyY1 = 0, 0, r.w, r.h\n'
              '\t\tr.customShaderLogged = make(map[string]bool)\n'
              '\t\tr.blendStateLogged = make(map[string]bool)\n'
              '\t\tr.dumpQuad = os.Getenv("IKEMEN_SW_DUMP_QUAD") == "1"\n'
              '\t\tr.palTableCache = make(map[swPalKey]*[2048]byte)\n'
              '\t\tLogMessage("[Linux FB] display %dx%d, engine framebuffer %dx%d", fb.w, fb.h, r.w, r.h)\n'
              '\t\treturn\n'
              '\t}\n', 1)
          old_present = ('func (r *Renderer_SW) present() {\n'
                         '\tif r.target == nil || r.renderer == nil {\n'
                         '\t\treturn\n'
                         '\t}\n')
          need(t.count(old_present) == 1, 'sw present anchor count=%d' % t.count(old_present))
          t = t.replace(old_present,
              'func (r *Renderer_SW) present() {\n'
              '\tif r.fb != nil {\n'
              '\t\tr.fb.blit(r.pix, r.w, r.h, int32(r.pitch))\n'
              '\t\treturn\n'
              '\t}\n'
              '\tif r.target == nil || r.renderer == nil {\n'
              '\t\treturn\n'
              '\t}\n', 1)
          old_close = ('func (r *Renderer_SW) Close() {\n'
                       '\tif r.target != nil {\n')
          need(t.count(old_close) == 1, 'sw close anchor count=%d' % t.count(old_close))
          t = t.replace(old_close,
              'func (r *Renderer_SW) Close() {\n'
              '\tif r.fb != nil {\n'
              '\t\tr.fb.close()\n'
              '\t\tr.fb = nil\n'
              '\t}\n'
              '\tif r.target != nil {\n', 1)
          old_name = 'func (r *Renderer_SW) GetName() string { return "SDL2 Software" }'
          need(t.count(old_name) == 1, 'sw getname anchor count=%d' % t.count(old_name))
          t = t.replace(old_name,
              'func (r *Renderer_SW) GetName() string {\n'
              '\tif r.fb != nil {\n'
              '\t\treturn "Linux FB"\n'
              '\t}\n'
              '\treturn "SDL2 Software"\n'
              '}', 1)
          open(rp, 'w', encoding='utf-8', newline='\n').write(t)
          print('PATCH5_OK: render_sw.go FB support added')

          # ===== 5.3 system_sdl.go：FB 模式跳过窗口创建 + Window 方法 nil 保护 =====
          sp = 'src/system_sdl.go'
          s = open(sp, encoding='utf-8', newline='').read()
          nw_anchor = ('func (s *System) newWindow(w, h int) (*Window, error) {\n'
                       '\tvar err error\n')
          need(s.count(nw_anchor) == 1, 'newWindow anchor count=%d' % s.count(nw_anchor))
          s = s.replace(nw_anchor,
              nw_anchor +
              '\t// Linux FB mode: never create an SDL window (GBM/EGL surfaces are\n'
              '\t// broken on this device - libmali userspace/kernel version mismatch).\n'
              '\t// SDL is still initialized so the kmsdrm driver owns evdev input.\n'
              '\tif sys.cfg.Video.RenderMode == "Linux FB" {\n'
              '\t\tchk(sdl.Init(sdl.INIT_AUDIO | sdl.INIT_VIDEO | sdl.INIT_JOYSTICK | sdl.INIT_EVENTS | sdl.INIT_GAMECONTROLLER | sdl.INIT_HAPTIC | sdl.INIT_TIMER))\n'
              '\t\tfor i := range input.controllers {\n'
              '\t\t\tinput.controllerstate[i] = &ControllerState{Buttons: make(map[sdl.GameControllerButton]byte)}\n'
              '\t\t}\n'
              '\t\tLogMessage("[Linux FB] skipping SDL window creation, input via kmsdrm evdev")\n'
              '\t\treturn &Window{title: s.cfg.Config.WindowTitle, w: w, h: h}, nil\n'
              '\t}\n', 1)
          old_sb = ('func (w *Window) SwapBuffers() {\n'
                    '\tcalculateFPS()\n'
                    '\tw.Window.GLSwap()\n'
                    '}')
          need(s.count(old_sb) == 1, 'swapbuffers anchor count=%d' % s.count(old_sb))
          s = s.replace(old_sb,
              'func (w *Window) SwapBuffers() {\n'
              '\tcalculateFPS()\n'
              '\tif w.Window == nil {\n'
              '\t\treturn\n'
              '\t}\n'
              '\tw.Window.GLSwap()\n'
              '}', 1)
          old_si = ('func (w *Window) SetIcon(icon []image.Image) {\n'
                    '\tif surface, err := w.imageToSurface(icon[0]); err == nil {')
          need(s.count(old_si) == 1, 'seticon anchor count=%d' % s.count(old_si))
          s = s.replace(old_si,
              'func (w *Window) SetIcon(icon []image.Image) {\n'
              '\tif w.Window == nil {\n'
              '\t\treturn\n'
              '\t}\n'
              '\tif surface, err := w.imageToSurface(icon[0]); err == nil {', 1)
          old_gs = ('func (w *Window) GetSize() (int, int) {\n'
                    '\tw2, h2 := w.Window.GetSize()\n'
                    '\treturn int(w2), int(h2)\n'
                    '}')
          need(s.count(old_gs) == 1, 'getsize anchor count=%d' % s.count(old_gs))
          s = s.replace(old_gs,
              'func (w *Window) GetSize() (int, int) {\n'
              '\tif w.Window == nil {\n'
              '\t\treturn w.w, w.h\n'
              '\t}\n'
              '\tw2, h2 := w.Window.GetSize()\n'
              '\treturn int(w2), int(h2)\n'
              '}', 1)
          old_tf = ('func (w *Window) toggleFullscreen() {\n'
                    '\tif w.fullscreen {')
          need(s.count(old_tf) == 1, 'togglefs anchor count=%d' % s.count(old_tf))
          s = s.replace(old_tf,
              'func (w *Window) toggleFullscreen() {\n'
              '\tif w.Window == nil {\n'
              '\t\treturn\n'
              '\t}\n'
              '\tif w.fullscreen {', 1)
          open(sp, 'w', encoding='utf-8', newline='\n').write(s)
          print('PATCH5_OK: system_sdl.go FB window skip + nil guards')

          # ===== 5.4 自检 =====
          chk_f = open('src/render_fb_linux.go', encoding='utf-8').read()
          for sym in ('func fbdevOpen', 'func (f *fbDev) blit'):
              need(sym in chk_f, 'render_fb_linux.go missing ' + sym)
          chk_sw = open('src/render_sw.go', encoding='utf-8').read()
          need('r.fb != nil' in chk_sw, 'render_sw.go FB hook missing')
          chk_sdl = open('src/system_sdl.go', encoding='utf-8').read()
          need('RenderMode == "Linux FB"' in chk_sdl, 'newWindow FB branch missing')
          print('PATCH5_OK: all self-checks passed')
          PY

          echo "=== 补丁5 确认 ==="
          ls -l src/render_fb_linux.go
          grep -c "Linux FB" src/render_sw.go src/system_sdl.go

      - name: 编译 (make, ARM64 native)
        run: |
          cd /tmp/ikemen
          export PATH=/usr/local/go/bin:$PATH
          unset CFLAGS CXXFLAGS CPPFLAGS LDFLAGS CPATH C_INCLUDE_PATH CPLUS_INCLUDE_PATH LIBRARY_PATH
          unset CGO_CFLAGS CGO_CXXFLAGS CGO_CPPFLAGS CGO_LDFLAGS CC CXX

          set +e
          make > /tmp/ikemen-build.log 2>&1
          rc=$?
          cat /tmp/ikemen-build.log
          set -e
          echo "BUILD_RC=$rc"

          {
            echo "## 编译结果：退出码 $rc"
            echo ""
            echo "### 日志最后 80 行"
            echo '```'
            tail -80 /tmp/ikemen-build.log
            echo '```'
            if [ "$rc" -ne 0 ]; then
              echo "### FFmpeg config.log 错误"
              echo '```'
              find build -path '*FFmpeg*/ffbuild/config.log' -exec grep -iE 'ERROR|libvpx|vpx' {} \; 2>/dev/null | tail -30 || echo "(无)"
              echo '```'
              echo "### SDL2 CMakeCache 视频后端"
              echo '```'
              find build -path '*SDL*/CMakeCache.txt' -exec grep -iE 'SDL_(KMSDRM|GBM|X11|WAYLAND|OPENGL|VIDEO)' {} \; 2>/dev/null | tail -40 || echo "(无)"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          exit $rc

      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sw-build-log
          path: /tmp/ikemen-build.log
          if-no-files-found: warn

      - name: 打包二进制和依赖库
        if: success()
        run: |
          cd /tmp/ikemen
          mkdir -p /tmp/out/lib
          # 找二进制
          BIN=$(find . -maxdepth 3 -type f -name 'Ikemen_GO.arm64' | head -1)
          echo "BIN=$BIN"
          test -n "$BIN" || { echo "二进制未找到"; find . -maxdepth 3 -type f -name 'Ikemen_GO*' ; exit 1; }
          cp "$BIN" /tmp/out/ikemen_linux.aarch64
          chmod +x /tmp/out/ikemen_linux.aarch64
          # 复制自编译的 SDL2/FFmpeg/xmp 动态库（如果有）
          find build -type f -name '*.so*' -path '*output/lib*' -exec cp -a {} /tmp/out/lib/ \; 2>/dev/null || true
          echo "=== 二进制 ==="
          ls -l /tmp/out/ikemen_linux.aarch64
          echo "=== 动态依赖 ==="
          ldd /tmp/out/ikemen_linux.aarch64 || true
          echo "=== 确认软件渲染器已编译进去 ==="
          strings /tmp/out/ikemen_linux.aarch64 | grep -iE "SDL2 Software|Renderer_SW|FORCE SOFTWARE" | head -10 || echo "WARN: 未找到软件渲染标识"
          cd /tmp/out
          zip -r /tmp/ikemen-software-r36s.zip .

      - name: 上传成品
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ikemen-software-r36s
          path: /tmp/ikemen-software-r36s.zip
          if-no-files-found: error
