name: Build Ikemen GO ARM64 for R36S

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container:
      image: ubuntu:20.04
      options: --privileged

    steps:
      - name: 安装编译依赖
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y \
            ca-certificates curl wget git pkg-config make ninja-build \
            nasm yasm build-essential zip unzip xz-utils file \
            libxmp-dev libsdl2-dev \
            libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libgl1-mesa-dev libgtk-3-dev \
            libavformat-dev libavcodec-dev libavutil-dev \
            libswresample-dev libswscale-dev libavfilter-dev \
            libdrm-dev libgbm-dev libegl1-mesa-dev libgles2-mesa-dev \
            libasound2-dev libpulse-dev \
            libx11-dev libxext-dev libxi-dev libxrandr-dev libxcursor-dev \
            libwayland-dev libxkbcommon-dev

          echo "glibc: $(ldd --version | head -1)"
          echo "gcc:   $(gcc --version | head -1)"
          echo "nasm:  $(nasm -v)"
          echo "sdl2:  $(pkg-config --modversion sdl2)"
          echo "gtk3:  $(pkg-config --modversion gtk+-3.0)"
          echo '#include <stdlib.h>' > /tmp/t.c
          echo 'int main(){return 0;}' >> /tmp/t.c
          gcc /tmp/t.c -o /tmp/t && echo "C_COMPILE_OK" || echo "C_COMPILE_FAILED"

      - name: 安装 Go 1.27.4 (arm64)
        run: |
          wget -q https://go.dev/dl/go1.27.4.linux-arm64.tar.gz -O /tmp/go.tgz
          rm -rf /usr/local/go
          tar -C /usr/local -xzf /tmp/go.tgz
          /usr/local/go/bin/go version

      - name: 获取 Ikemen GO 源码
        run: |
          git clone --depth 1 https://github.com/ikemen-engine/Ikemen-GO.git /tmp/ikemen
          cd /tmp/ikemen
          git log -1 --oneline

      - name: 编译 ARM64 二进制（隔离环境，避免 runner 污染 CFLAGS）
        run: |
          echo "=== 宿主注入的可疑环境变量（仅供诊断）==="
          env | grep -iE '^(CFLAGS|CXXFLAGS|CPPFLAGS|LDFLAGS|CGO_|CPATH|C_INCLUDE|CC=|CXX=)' || echo "(none)"

          # 关键：用 env -i 从零构造干净环境，彻底摆脱 GitHub runner 注入的
          # x86/clang 专用编译标志（-mno-red-zone / -Werror=unknown-warning-option）
          # 这些标志会污染 libvpx 的 configure，导致 VP8/VP9 decoder 被禁用。
          env -i \
            HOME=/root \
            PATH=/usr/local/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            TMPDIR=/tmp \
            TERM=xterm \
            GOOS=linux GOARCH=arm64 CGO_ENABLED=1 \
            GOPATH=/root/go GOCACHE=/root/.cache/go-build \
            BUILD_FFMPEG=yes BUILD_SDL2=no \
            FFMPEG_REV=release/7.1 LIBVPX_REV=v1.15.2 \
            bash -c '
              set -o pipefail
              cd /tmp/ikemen || exit 1
              echo "=== 干净环境确认 ==="
              env | grep -iE "^(CFLAGS|CXXFLAGS|CPPFLAGS|LDFLAGS|CGO_|CPATH|CC=|CXX=)" || echo "(clean - no injected flags)"
              echo "=== 开始编译 ==="
              ./build/build.sh LinuxARM
              rc=$?
              if [ $rc -ne 0 ]; then
                echo "========== 编译失败，诊断信息 =========="
                echo "--- libvpx config.log 末尾 ---"
                find /tmp/ikemen/build -path "*libvpx*/config.log" -exec tail -40 {} \; 2>/dev/null || echo "(no libvpx config.log)"
                echo "--- FFmpeg libvpx 相关诊断 ---"
                find /tmp/ikemen/build -path "*/ffbuild/config.log" -exec grep -iE "libvpx|vpx_codec|ERROR" {} \; 2>/dev/null | tail -30 || echo "(no ffmpeg config.log)"
                echo "--- vpx.pc 是否生成 ---"
                find /tmp/ikemen/build -name "vpx.pc" 2>/dev/null || echo "(no vpx.pc -> libvpx 未成功安装)"
              fi
              exit $rc
            '

          file Ikemen_GO_LinuxARM 2>/dev/null || file bin/Ikemen_GO_LinuxARM

      - name: 打包二进制和依赖库
        run: |
          cd /tmp/ikemen
          mkdir -p /tmp/out/lib
          cp Ikemen_GO_LinuxARM /tmp/out/ 2>/dev/null || cp bin/Ikemen_GO_LinuxARM /tmp/out/
          cp -a lib/. /tmp/out/lib/ 2>/dev/null || true
          echo "=== 二进制动态依赖 ==="
          file /tmp/out/Ikemen_GO_LinuxARM || true
          ldd /tmp/out/Ikemen_GO_LinuxARM || true
          cd /tmp/out
          zip -r /tmp/ikemen-arm64-r36s.zip .

      - name: 上传成品
        uses: actions/upload-artifact@v4
        with:
          name: ikemen-arm64-r36s
          path: /tmp/ikemen-arm64-r36s.zip
          if-no-files-found: error
