name: Build Ikemen GO ARM64 for R36S

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container:
      image: ubuntu:20.04
      options: --privileged
    defaults:
      run:
        shell: bash

    steps:
      - name: 安装编译依赖
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y \
            ca-certificates curl wget git pkg-config make ninja-build \
            nasm yasm build-essential zip unzip xz-utils file python3 \
            cmake libxmp-dev libsdl2-dev \
            libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libgl1-mesa-dev libgtk-3-dev \
            libavformat-dev libavcodec-dev libavutil-dev \
            libswresample-dev libswscale-dev libavfilter-dev \
            libdrm-dev libgbm-dev libegl1-mesa-dev libgles2-mesa-dev \
            libasound2-dev libpulse-dev \
            libx11-dev libxext-dev libxi-dev libxrandr-dev libxcursor-dev \
            libwayland-dev libxkbcommon-dev

          echo "glibc: $(ldd --version | head -1)"
          echo "gcc:   $(gcc --version | head -1)"
          echo "nasm:  $(nasm -v)"
          echo "sdl2:  $(pkg-config --modversion sdl2)"
          echo "gtk3:  $(pkg-config --modversion gtk+-3.0)"
          echo '#include <stdlib.h>' > /tmp/t.c
          echo 'int main(){return 0;}' >> /tmp/t.c
          gcc /tmp/t.c -o /tmp/t && echo "C_COMPILE_OK" || echo "C_COMPILE_FAILED"

      - name: 安装 Go 1.27.4 (arm64)
        run: |
          wget -q https://go.dev/dl/go1.27.4.linux-arm64.tar.gz -O /tmp/go.tgz
          rm -rf /usr/local/go
          tar -C /usr/local -xzf /tmp/go.tgz
          /usr/local/go/bin/go version

      - name: 获取 Ikemen GO 源码
        run: |
          git clone --depth 1 https://github.com/ikemen-engine/Ikemen-GO.git /tmp/ikemen
          cd /tmp/ikemen
          git log -1 --oneline

      - name: 编译 ARM64 二进制（清理污染 + 全程日志）
        run: |
          cd /tmp/ikemen
          export PATH=/usr/local/go/bin:$PATH

          echo "=== 编译前环境（诊断 runner 注入的污染）==="
          env | grep -iE '^(CFLAGS|CXXFLAGS|CPPFLAGS|LDFLAGS|CGO_|CPATH|C_INCLUDE|CC=|CXX=)' || echo "(none)"

          # 精准清除被注入的污染变量（x86/clang 专用标志会毁掉 arm64 的 libvpx configure）
          unset CFLAGS CXXFLAGS CPPFLAGS LDFLAGS CPATH C_INCLUDE_PATH CPLUS_INCLUDE_PATH LIBRARY_PATH
          unset CGO_CFLAGS CGO_CXXFLAGS CGO_CPPFLAGS CGO_LDFLAGS
          unset CC CXX
          # 显式指定原生 gcc，确保 libvpx/FFmpeg configure 不继承错误编译器
          export CC=gcc
          export CXX=g++
          # 让 check_lib 的 -lvpx 回退探测也能找到静态库
          export LIBRARY_PATH="/tmp/ikemen/build/ffmpeg/lib"

          export BUILD_FFMPEG=yes
          export BUILD_SDL2=yes
          export FFMPEG_REV=release/7.1
          export LIBVPX_REV=v1.15.2

          python3 - <<'PY'
          import io, sys

          def need(cond, msg):
              if not cond:
                  sys.exit('PATCH_FAILED: ' + msg)

          # ===== 补丁 1：build.sh 里 FFmpeg 静态链接 libvpx =====
          # 官方把 libvpx 编成纯静态库，但 Linux 分支的 FFmpeg configure
          # 没带 --pkg-config-flags=--static，导致 VP8/VP9 链接探测失败退出。
          p = '/tmp/ikemen/build/build.sh'
          s = open(p, encoding='utf-8', newline='').read()
          needle = '\t\t\t"--enable-parser=vp8,vp9,opus,vorbis"'
          need(s.count(needle) >= 3, 'ffmpeg enable-parser anchor')
          i = s.rfind(needle) + len(needle)
          s = s[:i] + '\n\t\t\t"--pkg-config-flags=--static"' + s[i:]

          # ===== 补丁 2：SDL2 自编译时启用 KMSDRM/GBM（无 X server 直连 framebuffer） =====
          # 默认 CMake 开了 X11/Wayland/Vulkan，在 R36S 无显示服务器时建不了窗口。
          old_cmake = ('-DSDL_X11=ON -DSDL_WAYLAND=ON -DSDL_ALSA=ON -DSDL_PULSEAUDIO=ON \\\n'
                       '\t\t-DSDL_OPENGL=ON -DSDL_OPENGLES=ON -DSDL_VULKAN=ON')
          new_cmake = ('-DSDL_X11=OFF -DSDL_WAYLAND=OFF -DSDL_KMSDRM=ON -DSDL_OPENGL=ON \\\n'
                       '\t\t-DSDL_OPENGLES=ON -DSDL_ALSA=ON -DSDL_PULSEAUDIO=OFF -DSDL_VULKAN=OFF')
          need(s.count(old_cmake) == 1, 'sdl2 cmake anchor')
          s = s.replace(old_cmake, new_cmake, 1)
          open(p, 'w', encoding='utf-8', newline='\n').write(s)
          print('PATCH_OK: ffmpeg static + SDL2 KMSDRM')

          # ===== 补丁 3：把 GLES32 渲染器引入桌面 Linux 构建 =====
          src = '/tmp/ikemen/src/'
          def patch_file(fn, old, new, cnt=1):
              fp = src + fn
              t = open(fp, encoding='utf-8', newline='').read()
              need(t.count(old) == cnt, fn + ' anchor count=%d expected=%d' % (t.count(old), cnt))
              open(fp, 'w', encoding='utf-8', newline='\n').write(t.replace(old, new, cnt))

          # 3a) GLES32 渲染器与字体：build tag 由 android 扩为 linux||android
          patch_file('render_gles32.go', '//go:build android', '//go:build linux || android')
          patch_file('font_gles32.go', '//go:build android', '//go:build linux || android')

          # 3b) util_desktop.go 的 selectRenderer 支持 GLES，并设为默认
          old_sel = ('\tswitch cfgVal {\n'
                     '\tcase "OpenGL 3.3":')
          new_sel = ('\tswitch cfgVal {\n'
                     '\tcase "OpenGL ES 3.2":\n'
                     '\t\tgfx = &Renderer_GLES32{}\n'
                     '\t\tgfxFont = &FontRenderer_GLES32{}\n'
                     '\tcase "OpenGL 3.3":')
          patch_file('util_desktop.go', old_sel, new_sel)
          patch_file('util_desktop.go',
                     'fmt.Printf("Error: Invalid RenderMode \'%s\'. Defaulting to OpenGL 3.3.\\n", cfgVal)\n'
                     '\t\tgfx = &Renderer_GL33{}\n'
                     '\t\tgfxFont = &FontRenderer_GL33{}',
                     'fmt.Printf("Error: Invalid RenderMode \'%s\'. Defaulting to OpenGL ES 3.2.\\n", cfgVal)\n'
                     '\t\tgfx = &Renderer_GLES32{}\n'
                     '\t\tgfxFont = &FontRenderer_GLES32{}')

          # 3c) Linux 版 eglGetProcAddress（android 版依赖 JNI，不能直接用于 Linux）
          egl = ('//go:build linux\n\n'
                 'package main\n\n'
                 '/*\n'
                 '#cgo LDFLAGS: -lEGL\n'
                 '#include <stdlib.h>\n'
                 '#include <EGL/egl.h>\n'
                 '*/\n'
                 'import "C"\n'
                 'import "unsafe"\n\n'
                 '// eglGetProcAddress loads GL/GLES function pointers for the current EGL context.\n'
                 '//go:noinline\n'
                 'func eglGetProcAddress(name string) unsafe.Pointer {\n'
                 '\tcname := C.CString(name)\n'
                 '\tdefer C.free(unsafe.Pointer(cname))\n'
                 '\treturn unsafe.Pointer(C.eglGetProcAddress(cname))\n'
                 '}\n')
          open(src + 'util_gles_linux.go', 'w', encoding='utf-8', newline='\n').write(egl)
          print('PATCH_OK: GLES32 renderer enabled for Linux')

          # ===== 补丁 4：config.ini 用 GLES3.2（引擎初始化会写回，这里先设对） =====
          cfg = '/tmp/ikemen/save/config.ini'
          if __import__('os').path.exists(cfg):
              t = open(cfg, encoding='utf-8', errors='replace').read()
              import re
              t = re.sub(r'^(RenderMode\s*=\s*).*$', r'\1OpenGL ES 3.2', t, flags=re.M)
              open(cfg, 'w', encoding='utf-8', newline='\n').write(t)
              print('PATCH_OK: config RenderMode=OpenGL ES 3.2')
          PY

          echo "=== 清理后环境 ==="
          env | grep -iE '^(CFLAGS|CXXFLAGS|CPPFLAGS|LDFLAGS|CGO_|CPATH|CC=|CXX=|LIBRARY_PATH)' || echo "(clean)"
          echo "=== 补丁确认 ==="
          grep -n -- '--pkg-config-flags=--static' /tmp/ikemen/build/build.sh || echo "FFMPEG_STATIC_MISSING"
          grep -n -- 'SDL_KMSDRM=ON' /tmp/ikemen/build/build.sh || echo "KMSDRM_MISSING"
          grep -n -- 'linux || android' /tmp/ikemen/src/render_gles32.go || echo "GLES_TAG_MISSING"
          grep -n -- 'OpenGL ES 3.2' /tmp/ikemen/src/util_desktop.go || echo "SELECTOR_MISSING"
          ls -l /tmp/ikemen/src/util_gles_linux.go || echo "EGL_FILE_MISSING"

          set +e
          # 不用 PIPESTATUS（sh/dash 不支持，会 Bad substitution）：
          # 先重定向到日志，用 $? 取退出码，再 cat 出来，任何 shell 都兼容。
          ./build/build.sh LinuxARM > /tmp/ikemen-build.log 2>&1
          rc=$?
          cat /tmp/ikemen-build.log
          set -e
          echo "BUILD_RC=$rc"

          # 把关键结果写进网页直接可见的 Summary，方便一眼定位
          {
            echo "## 编译结果：退出码 $rc"
            echo ""
            echo "### 日志最后 50 行"
            echo '```'
            tail -50 /tmp/ikemen-build.log
            echo '```'
            if [ "$rc" -ne 0 ]; then
              echo "### libvpx config.log 末尾"
              echo '```'
              find /tmp/ikemen/build -path '*libvpx*/config.log' -exec tail -30 {} \; 2>/dev/null || echo "(无 libvpx config.log)"
              echo '```'
              echo "### FFmpeg 关于 libvpx 的诊断"
              echo '```'
              find /tmp/ikemen/build -path '*/ffbuild/config.log' -exec grep -iE 'libvpx|vpx_codec|ERROR' {} \; 2>/dev/null | tail -25 || echo "(无 ffmpeg config.log)"
              echo '```'
              echo "### vpx.pc 是否生成"
              find /tmp/ikemen/build -name vpx.pc 2>/dev/null || echo "未找到 vpx.pc（libvpx 未成功安装）"
              echo "### vpx.pc 内容"
              echo '```'
              find /tmp/ikemen/build -name vpx.pc -exec sh -c 'echo "--- $1"; cat "$1"' _ {} \; 2>/dev/null || true
              echo '```'
              echo "### pkg-config 静态链接参数"
              echo '```'
              PKG_CONFIG_PATH=/tmp/ikemen/build/ffmpeg/lib/pkgconfig pkg-config --static --libs vpx 2>&1 || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          exit $rc

      - name: 上传编译日志（无论成败）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ikemen-build-log
          path: /tmp/ikemen-build.log
          if-no-files-found: warn

      - name: 打包二进制和依赖库
        if: success()
        run: |
          cd /tmp/ikemen
          mkdir -p /tmp/out/lib
          cp Ikemen_GO_LinuxARM /tmp/out/ 2>/dev/null || cp bin/Ikemen_GO_LinuxARM /tmp/out/
          cp -a lib/. /tmp/out/lib/ 2>/dev/null || true
          echo "=== 二进制文件类型 ==="
          file /tmp/out/Ikemen_GO_LinuxARM || true
          echo "=== 二进制动态依赖 ==="
          ldd /tmp/out/Ikemen_GO_LinuxARM || true
          cd /tmp/out
          zip -r /tmp/ikemen-arm64-r36s.zip .

      - name: 上传成品
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ikemen-arm64-r36s
          path: /tmp/ikemen-arm64-r36s.zip
          if-no-files-found: error
